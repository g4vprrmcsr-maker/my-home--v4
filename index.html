<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kelivo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="appbar-btn" id="btn-drawer" aria-label="菜单"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
      <div class="topbar-title">
        <div class="title-main" id="title-main">新的对话</div>
        <button class="title-sub" id="title-sub">GPT-4o (OpenAI)</button>
      </div>
      <div class="topbar-actions">
        <button class="appbar-btn" id="btn-minimap" aria-label="导航"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg></button>
        <button class="appbar-btn" id="btn-newchat" aria-label="新对话"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h8M12 8v8"/></svg></button>
      </div>
    </header>

    <main class="messages" id="messages"></main>

    <footer class="input-area" id="input-area">
      <div class="tools-panel" id="tools-panel" hidden></div>
      <div class="input-card">
        <textarea class="input-field" id="input-field" rows="1" placeholder="有什么想聊的…"></textarea>
        <div class="action-row">
          <div class="action-left">
            <button class="compact-btn model-btn" id="btn-model" aria-label="选择模型"><span class="model-chip" id="model-chip">4o</span></button>
            <button class="compact-btn" id="btn-search" aria-label="联网搜索"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg></button>
            <button class="compact-btn" id="btn-reason" aria-label="推理"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.9.8A3 3 0 0 0 5 12a3 3 0 0 0 1.5 5.6A3 3 0 0 0 12 19V5Z"/><path d="M12 5a3 3 0 1 1 5.9.8A3 3 0 0 1 19 12a3 3 0 0 1-1.5 5.6A3 3 0 0 1 12 19"/></svg></button>
          </div>
          <div class="action-right">
            <button class="compact-btn" id="btn-more" aria-label="更多工具"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="send-btn" id="btn-send" aria-label="发送" disabled><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
          </div>
        </div>
      </div>
    </footer>
  </div>

  <div class="scrim" id="scrim" hidden></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-top">
      <div class="drawer-search"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="drawer-search-input" placeholder="搜索对话…"></div>
      <button class="drawer-history" id="btn-history" aria-label="历史"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
    </div>
    <button class="assistant-bar" id="assistant-bar">
      <div class="avatar assistant-cur" id="drawer-assistant-avatar">K</div>
      <span class="assistant-cur-name" id="drawer-assistant-name">默认助手</span>
      <svg class="chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
    </button>
    <div class="drawer-list" id="drawer-list"></div>
    <div class="drawer-user">
      <div class="avatar user-big" id="user-avatar">我</div>
      <span class="user-name" id="user-name">用户</span>
      <button class="round-btn" id="btn-translate" aria-label="翻译"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg></button>
      <button class="round-btn" id="btn-settings" aria-label="设置"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg></button>
    </div>
  </aside>

  <div class="screen-host" id="screen-host"></div>
  <div class="sheet-host" id="sheet-host" hidden></div>
  <div class="toast" id="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
