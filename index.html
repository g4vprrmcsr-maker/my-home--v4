<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kelivo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app" id="app">
    <!-- 顶部栏 -->
    <header class="topbar">
      <button class="icon-btn" id="btn-drawer" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
      </button>
      <div class="topbar-title">
        <div class="assistant-avatar sm" id="title-avatar">K</div>
        <div class="topbar-textcol">
          <div class="title-main" id="title-main">新的对话</div>
          <button class="title-sub" id="title-sub">GPT-4o (OpenAI)</button>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-minimap" aria-label="导航">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>
        </button>
        <button class="icon-btn" id="btn-newchat" aria-label="新对话">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h8M12 8v8"/></svg>
        </button>
      </div>
    </header>

    <!-- 消息区 -->
    <main class="messages" id="messages">
      <div class="msg-row user">
        <div class="msg-head">
          <span class="msg-name">你</span>
          <div class="user-avatar sm">我</div>
        </div>
        <div class="bubble user-bubble">帮我看看这个小家还差什么</div>
      </div>
      <div class="msg-row assistant">
        <div class="msg-head">
          <div class="assistant-avatar sm">K</div>
          <span class="msg-name">Kelivo</span>
        </div>
        <div class="bubble assistant-bubble"><p>已经很接近了，就差最后一收——把卡片提白、阴影收紧，糊感就没了。</p></div>
      </div>
    </main>

    <!-- 底部输入栏 -->
    <footer class="input-area" id="input-area">
      <div class="input-card">
        <textarea class="input-field" id="input-field" rows="1" placeholder="有什么想聊的…"></textarea>
        <div class="action-row">
          <div class="left-actions">
            <button class="compact-btn model-btn" id="btn-model" aria-label="选择模型">
              <span class="model-chip">4o</span>
            </button>
            <button class="compact-btn" id="btn-search" aria-label="联网搜索">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10Z"/></svg>
            </button>
            <button class="compact-btn" id="btn-reason" aria-label="推理强度">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5a3 3 0 1 0-5.9.8A3 3 0 0 0 5 12a3 3 0 0 0 1.5 5.6A3 3 0 0 0 12 19m0-14a3 3 0 1 1 5.9.8A3 3 0 0 1 19 12a3 3 0 0 1-1.5 5.6A3 3 0 0 1 12 19m0-14v14"/></svg>
            </button>
          </div>
          <div class="right-actions">
            <button class="compact-btn" id="btn-more" aria-label="更多">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button class="compact-btn" id="btn-voice" aria-label="语音输入">
              <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
            </button>
            <button class="send-btn" id="btn-send" aria-label="发送" disabled>
              <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
            </button>
          </div>
        </div>
      </div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
