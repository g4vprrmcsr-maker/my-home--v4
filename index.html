<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Kelivo</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="app" id="app">
    <header class="topbar">
      <button class="icon-btn" id="btn-drawer" aria-label="菜单">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="topbar-title">
        <div class="title-main" id="title-main">新的对话</div>
        <button class="title-sub" id="title-sub">GPT-4o (OpenAI)</button>
      </div>
      <div class="topbar-actions">
        <button class="icon-btn" id="btn-minimap" aria-label="导航">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg>
        </button>
        <button class="icon-btn" id="btn-newchat" aria-label="新对话">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M8 12h8M12 8v8"/></svg>
        </button>
      </div>
    </header>

    <main class="messages" id="messages">
      <div class="msg-row user">
        <div class="bubble user-bubble">帮我看看这个小家还差什么</div>
      </div>
      <div class="msg-row assistant">
        <div class="assistant-head">
          <div class="assistant-avatar">K</div>
          <span class="assistant-name">Kelivo</span>
        </div>
        <div class="bubble assistant-bubble">
          <p>已经很接近了，就差最后一收——把卡片提白、阴影收紧，糊感就没了。</p>
        </div>
      </div>
    </main>

    <footer class="input-area" id="input-area">
      <div class="input-bar">
        <button class="input-icon" id="btn-add" aria-label="添加">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        </button>
        <textarea class="input-field" id="input-field" rows="1" placeholder="发送消息…"></textarea>
        <button class="input-icon tool" id="btn-tools" aria-label="工具">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0 0-16 8 8 0 0 0 0 16Z"/><path d="M12 8v4l3 2"/></svg>
        </button>
        <button class="send-btn" id="btn-send" aria-label="发送">
          <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
        </button>
      </div>
    </footer>
  </div>
  <script src="app.js"></script>
</body>
</html>
