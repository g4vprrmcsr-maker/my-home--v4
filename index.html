<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F7F7F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121213" media="(prefers-color-scheme: dark)">
<title>Kelivo</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="topbar" id="topbar">
    <button class="appbar-btn drawer-btn" id="btn-drawer" aria-label="菜单"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 6h13M3 12h18M3 18h9"/></svg></button>
    <div class="topbar-title">
      <div class="title-main" id="title-main">新对话</div>
      <button class="title-sub" id="title-sub">claude-opus-4-8 (Kiro)</button>
    </div>
    <div class="topbar-actions">
      <button class="appbar-btn wide" id="btn-minimap" aria-label="导航"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3 3 6v15l6-3 6 3 6-3V3l-6 3-6-3Z"/><path d="M9 3v15M15 6v15"/></svg></button>
      <button class="appbar-btn wide" id="btn-newchat" aria-label="新对话"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7.9 20A9 9 0 1 0 4 16.1L2 22Z"/><path d="M12 8v6M9 11h6"/></svg></button>
    </div>
  </header>

  <main class="messages" id="messages"></main>

  <footer class="input-area" id="input-area">
    <div class="tools-panel" id="tools-panel" hidden></div>
    <div class="input-card">
      <textarea class="input-field" id="input-field" rows="1" placeholder="输入消息与AI聊天"></textarea>
      <div class="action-row">
        <div class="action-left">
          <button class="cbtn model-btn" id="btn-model" aria-label="模型"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2.97 12.92 7 15v4l4 2v-4l-4-2-4-2Z"/><path d="m7 15 4-2 4 2-4 2Z"/><path d="M12 7 8 5 4 7l4 2Z"/><path d="m16 5-4 2 4 2 4-2Z"/><path d="M17 15v4l4-2v-4Z"/><path d="m13 15 4 2 4-2-4-2Z"/></svg></button>
          <button class="cbtn" id="btn-search" aria-label="搜索"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/></svg></button>
          <button class="cbtn" id="btn-reason" aria-label="推理"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9.5 2a5.5 5.5 0 0 0-5.3 7 5 5 0 0 0 .8 8.5A4 4 0 0 0 12 20V2ZM14.5 2a5.5 5.5 0 0 1 5.3 7 5 5 0 0 1-.8 8.5A4 4 0 0 1 12 20"/></svg></button>
          <button class="cbtn" id="btn-mcp" aria-label="工具"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 12-8.5 8.5a2.1 2.1 0 0 1-3-3L12 9"/><path d="M17.6 15 22 10.6"/><path d="m20.9 11.7-1.2-1.2c-.6-.6-1-1.4-1-2.3v-.8L16 4.6A5.6 5.6 0 0 0 12 3H9l.9.8A6.2 6.2 0 0 1 12 8.4V10l2 2h.9c.8 0 1.6.3 2.2.9l1.3 1.3"/></svg></button>
        </div>
        <div class="action-right">
          <button class="cbtn more-btn" id="btn-more" aria-label="更多"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
          <button class="send-btn" id="btn-send" aria-label="发送" disabled><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
        </div>
      </div>
    </div>
  </footer>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer">
  <div class="drawer-top">
    <div class="drawer-search">
      <button class="ds-mode" id="btn-search-mode" aria-label="搜索模式"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8V4H8M4 8h16v12H4zM2 14h2M20 14h2M15 13v2M9 13v2"/></svg></button>
      <input id="drawer-search-input" placeholder="搜索当前助手">
    </div>
    <button class="drawer-history" id="btn-history" aria-label="历史"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/></svg></button>
  </div>
  <button class="assistant-bar" id="assistant-bar">
    <div class="avatar assistant-cur" id="drawer-assistant-avatar">K</div>
    <span class="assistant-cur-name" id="drawer-assistant-name">默认助手</span>
    <svg class="ab-chev" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
  </button>
  <div class="drawer-list" id="drawer-list"></div>
  <div class="drawer-user">
    <div class="avatar user-big" id="user-avatar">我</div>
    <span class="user-name" id="user-name">用户</span>
    <button class="round-btn" id="btn-translate" aria-label="翻译"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m5 8 6 6M4 14l6-6 2-3M2 5h12M7 2h1M22 22l-5-10-5 10M14 18h6"/></svg></button>
    <button class="round-btn" id="btn-settings" aria-label="设置"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.6 1.6 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.6 1.6 0 0 0-1.8-.3 1.6 1.6 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1A1.6 1.6 0 0 0 9 19.4a1.6 1.6 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.6 1.6 0 0 0 .3-1.8 1.6 1.6 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1A1.6 1.6 0 0 0 4.6 9a1.6 1.6 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.6 1.6 0 0 0 1.8.3H9a1.6 1.6 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.6 1.6 0 0 0 1 1.5 1.6 1.6 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.6 1.6 0 0 0-.3 1.8V9a1.6 1.6 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.6 1.6 0 0 0-1.5 1Z"/></svg></button>
  </div>
</aside>

<div class="screen-host" id="screen-host"></div>
<div class="sheet-host" id="sheet-host" hidden></div>
<div class="toast" id="toast" hidden></div>

<script>
try{var _k=JSON.parse(localStorage.getItem('kelivo'));if(_k){if(!_k.model||!_k.model.name){_k.model={provider:'Kiro',pid:'kiro',id:'claude-opus-4-8',name:'claude-opus-4-8'};}localStorage.setItem('kelivo',JSON.stringify(_k));}}catch(e){}
</script>
<script src="app.js"></script>
</body>
</html>
